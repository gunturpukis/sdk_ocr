name: CI

on:
  push:
    branches: [main]
    paths: ["web-sdk-bridge/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["web-sdk-bridge/**", ".github/workflows/ci.yml"]

jobs:
  typecheck:
    name: Typecheck & pack smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-sdk-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-sdk-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pack smoke test (prepack builds dist/)
        run: npm pack --dry-run
