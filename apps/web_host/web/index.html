<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ocr_web_host">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ocr_web_host</title>
  <link rel="manifest" href="manifest.json">

  <!--
    onnxruntime-web — WAJIB untuk jalur on-device inference di web.
    Tanpa script ini `ort` tidak ada di window, `InferenceSessionImpl`
    (inference_session_web.dart) gagal load model, dan web host hanya
    bisa scan cloud-only.

    CATATAN PRODUCTION:
    1. Versi di-pin. Kalau perlu upgrade, cek breaking changes API
       `ort.InferenceSession`/`ort.Tensor` dulu — interop di
       inference_session_web.dart ditulis untuk API versi ini.
    2. `ort.min.js` akan memuat file .wasm pendamping dari CDN yang sama
       (path default `ort.env.wasm.wasmPaths` mengikuti versi bundle).
       Untuk production yang butuh kontrol penuh (tanpa CDN pihak ketiga):
       self-host folder dist/ (ort-wasm-*.wasm, ort-wasm-simd*.jsep.js dll),
       lalu set `ort.env.wasm.wasmPaths = '/scan/ort/'` SEBELUM script ini
       atau via script bootstrap terpisah.
    3. Halaman HOST yang meng-embed iframe ini TIDAK butuh COOP/COEP untuk
       build wasm single-thread ini; header itu baru perlu kalau memakai
       varian WASM threads (lihat README web-sdk-bridge).
  -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
