name: ocr_ui
description: >
  Layar dan widget scan siap pakai di atas ocr_core — camera preview, frame
  overlay, confidence badge. Opsional: consumer boleh pakai ocr_core langsung
  tanpa package ini kalau mau UI custom sendiri.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  camera: ^0.12.0+2
  image: ^4.9.1
  image_picker: ^1.2.3
  flutter:
    sdk: flutter
 
  ocr_core:
    path: ../ocr_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
